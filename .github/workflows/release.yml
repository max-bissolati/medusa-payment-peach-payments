name: release

# Publishes to npm when a version tag (v*) is pushed.
# Uses npm trusted publishing. Configure the matching publisher in npm first.
# See docs/RELEASING.md. No long-lived publish token is required.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: install trusted-publishing-compatible npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - name: verify publish artifact
        run: |
          npm run build
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q ".medusa/server/src/providers/peach/index.js" pack.txt
          grep -q ".medusa/server/src/providers/peach/index.d.ts" pack.txt
          if grep -E "^npm notice [0-9.]+[kMB ]+ (src|examples)/" pack.txt; then
            echo "publish artifact leaks src/ or examples/" >&2
            exit 1
          fi
          if grep -E "\.spec\.(js|ts|d\.ts)" pack.txt; then
            echo "publish artifact leaks spec files" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
